\* SPEC: TxSubmissionLocalStop.tla
\* Intentionally fails LocalStopCountsNoError: the fix answers the stop with
\* ErrStopServerProcess, but the message metric exempts only chain-sync's
\* stop sentinel, so every answered stop is counted as an error.
SPECIFICATION Spec

CONSTANTS
    Callback = "doneOnStop"
    JoinsCallbacks = TRUE
    MaxTx = 1
    MetricExemptsStop = FALSE

INVARIANT TypeOK
INVARIANT LocalStopBlamesNoPeer
INVARIANT BlockingAnswerLegal
INVARIANT LocalStopCountsNoError
