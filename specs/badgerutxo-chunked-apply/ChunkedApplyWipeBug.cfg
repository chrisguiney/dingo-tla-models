\* SPEC: ChunkedApply.tla
\* Dingo main: a reward epoch wipe row deletes every output row of the epoch in the transaction that holds it, and the batch's rows go in one transaction when the estimate fits. Expected: NeverTooBig is violated (ErrTxnTooBig, on a batch with no tip and no failure mark).
CONSTANTS
    ExtractOps = TRUE
    RewindStoppedBeforeRecord = TRUE
    KeepRollbackWithoutOps = TRUE
    RowsBeforeOps = TRUE
    RewindStrayCapture = FALSE
    SplitWipe = FALSE
    WipeAfterRollback = TRUE
    MaxCrashes = 2
SPECIFICATION Spec
INVARIANTS
    NeverTooBig
