\* SPEC: ChunkedApply.tla
\* The stale nonces are deleted ahead of the batch in bounded transactions, and the batch's own prune then finds none. Expected: every invariant holds, a crash or restart between the bulk prune and the batch included.
CONSTANTS
    ExtractOps = TRUE
    RewindStoppedBeforeRecord = TRUE
    KeepRollbackWithoutOps = TRUE
    RowsBeforeOps = TRUE
    RewindStrayCapture = FALSE
    SplitWipe = TRUE
    WipeAfterRollback = TRUE
    SplitPrune = TRUE
    MaxCrashes = 2
SPECIFICATION Spec
INVARIANTS
    NeverTooBig
    ReplayEqualsOnce
    FeeOnce
    FeeCounted
    RollbackKept
