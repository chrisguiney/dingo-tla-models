\* SPEC: ChunkedApply.tla
\* The wipe runs ahead of the plan in transactions of its own, as a prefix wipe does. Expected: every invariant holds, a crash or restart between the wipe and the puts included.
CONSTANTS
    ExtractOps = TRUE
    RewindStoppedBeforeRecord = TRUE
    KeepRollbackWithoutOps = TRUE
    RowsBeforeOps = TRUE
    RewindStrayCapture = FALSE
    SplitWipe = TRUE
    WipeAfterRollback = TRUE
    MaxCrashes = 2
SPECIFICATION Spec
INVARIANTS
    NeverTooBig
    ReplayEqualsOnce
    FeeOnce
    FeeCounted
    RollbackKept
