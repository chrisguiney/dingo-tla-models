\* SPEC: ChunkedApply.tla
\* Reachability probe, the branch: a batch stopped after its snapshot put transaction, with no journal entry, is not rewound, so the store briefly holds snapshot rows of an epoch it has no row for. Expected: SnapshotFollowsTip is violated; the replay converges (Fixed passes ReplayEqualsOnce with the same flags).
CONSTANTS
    ExtractOps = TRUE
    RewindStoppedBeforeRecord = TRUE
    KeepRollbackWithoutOps = TRUE
    RowsBeforeOps = TRUE
    RewindStrayCapture = FALSE
    SplitWipe = TRUE
    WipeAfterRollback = TRUE
    SplitPrune = TRUE
    MaxCrashes = 2
SPECIFICATION Spec
INVARIANTS
    SnapshotFollowsTip
