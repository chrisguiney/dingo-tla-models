\* SPEC: CsjDynamoStall.tla
\* Intentionally fails BusyDynamoKept: a hold excuses silence only after a
\* verified delivery, so a dynamo whose first header is parked before
\* verification is recycled while the node itself is still waiting on it.
SPECIFICATION Spec

CONSTANTS
    Rule = "deliveredOnly"
    Silent = FALSE
    Timeout = 3
    NodeWait = 6
    MaxTicks = 8

INVARIANT TypeOK
INVARIANT SilentDynamoReplaced
INVARIANT BusyDynamoKept
