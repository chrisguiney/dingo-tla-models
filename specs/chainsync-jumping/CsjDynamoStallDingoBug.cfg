\* SPEC: CsjDynamoStall.tla
\* Intentionally fails SilentDynamoReplaced: Dingo restarts the stall clock
\* while the stream is held, so a held dynamo that never delivers is never recycled.
SPECIFICATION Spec

CONSTANTS
    Rule = "dingo"
    Silent = TRUE
    Timeout = 3
    MaxTicks = 8

INVARIANT TypeOK
INVARIANT SilentDynamoReplaced
